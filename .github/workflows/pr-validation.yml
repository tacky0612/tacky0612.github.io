name: PR Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

# 同一 PR で新しい push があれば実行中のワークフローをキャンセルする
concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

# 既定は読み取りのみ（最小権限）
permissions:
  contents: read

jobs:
  validate:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript types
        run: npm run typecheck

      - name: Build application
        run: npm run build:app

      - name: Build Storybook
        run: npm run build:storybook

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  quality-gate:
    name: Format / Console
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 整形崩れは CI を失敗させる（従来は警告のみ）
      - name: Check code formatting
        run: npm run format:check

      # 本番コードに console.* が残っていたら失敗させる
      - name: Check for console statements
        run: |
          if grep -rn "console\.\(log\|error\|warn\|info\|debug\)" src/ \
            --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx"; then
            echo "::error::src/ に console.* が残っています。削除してください。"
            exit 1
          fi

  dependency-check:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 監査は情報提供に留める（開発依存の推移的な脆弱性で PR を止めないため）
      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true

  summary:
    needs: [validate, test, quality-gate, dependency-check]
    runs-on: ubuntu-latest
    if: always()

    # PR コメントの投稿・更新に必要
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: PR validation summary
        run: |
          echo "## PR Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint / Typecheck / Build | ${{ needs.validate.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Unit Tests | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format / Console | ${{ needs.quality-gate.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dependency Audit | ${{ needs.dependency-check.result }} |" >> "$GITHUB_STEP_SUMMARY"

      # サードパーティに依存せず、公式の actions/github-script で
      # マーカー付きコメントを探して更新（なければ新規作成）する = sticky コメント
      - name: Post sticky PR comment
        uses: actions/github-script@v9
        env:
          RESULT_VALIDATE: ${{ needs.validate.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_QUALITY: ${{ needs.quality-gate.result }}
          RESULT_DEP: ${{ needs.dependency-check.result }}
        with:
          script: |
            const issue_number = context.issue.number;
            if (!issue_number) {
              core.info('PR コンテキストではないためスキップします。');
              return;
            }

            const icon = (r) =>
              r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const rows = [
              ['Lint / Typecheck / Build', process.env.RESULT_VALIDATE],
              ['Unit Tests', process.env.RESULT_TEST],
              ['Format / Console', process.env.RESULT_QUALITY],
              ['Dependency Audit', process.env.RESULT_DEP],
            ];

            const marker = '<!-- pr-validation-summary -->';
            const { owner, repo } = context.repo;
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## PR Validation Summary',
              '',
              '| Check | Result |',
              '| --- | --- |',
              ...rows.map(([name, result]) => `| ${name} | ${icon(result)} ${result} |`),
              '',
              `<sub>commit \`${context.sha.substring(0, 7)}\` · [ワークフロー実行](${runUrl})</sub>`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
