version: 2
updates:
  # npm パッケージの更新
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # patch / minor はまとめて 1 PR に（auto-merge ワークフローと相性が良い）
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions 自体の更新
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
